[project]
name = "elijah-investigator"
version = "0.1.0"
description = "A local-first, AI-assisted terminal incident investigator"
requires-python = ">=3.10"
dependencies = ["textual>=1.0.0"]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
elijah = "elijah:main"
check-it = "check_it:main"
elijah-shell = "elijah_shell:main"

[tool.setuptools]
py-modules = ["elijah", "check_it", "elijah_shell", "shell_setup", "elijah_models", "elijah_docker", "elijah_remote"]

[tool.setuptools.packages.find]
include = ["elijah_shells*"]

[tool.setuptools.package-data]
elijah_shells = ["*.zsh", "*.sh", "*.fish"]

[tool.ruff]
line-length = 100
